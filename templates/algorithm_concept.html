<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفهوم الخوارزميات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; padding: 15px; direction: rtl; margin: 0; color: #0f172a; }
        .card { background: white; max-width: 550px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .school-header { text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 15px; }
        .school-name { font-size: 14px; color: #64748b; font-weight: 600; }
        .teacher-name { font-size: 13px; color: #94a3b8; margin-top: 2px; }
        h2 { color: #1e3a8a; text-align: center; margin-top: 0; font-size: 19px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 15px; }
        .progress-bar { background: #e2e8f0; border-radius: 10px; height: 10px; width: 100%; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s ease; }
        .svg-container { width: 100%; max-width: 340px; margin: 10px auto; display: block; }
        .question-box { background: #f8fafc; border-right: 4px solid #2563eb; padding: 12px; margin-top: 15px; border-radius: 6px; }
        .option-label { display: flex; align-items: center; margin: 8px 0; cursor: pointer; font-size: 13px; background: white; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; transition: background 0.2s; }
        .option-label:hover { background: #f1f5f9; }
        .option-label input { margin-left: 10px; }
        .btn { display: block; width: 100%; background: #2563eb; color: white; border: none; padding: 11px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; text-decoration: none; }
        .btn:hover { background: #1d4ed8; }
        .feedback { margin-top: 15px; padding: 11px; border-radius: 6px; font-weight: bold; display: none; text-align: center; font-size: 13px; }
        .feedback.correct { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .feedback.incorrect { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 90px; height: 90px; border-radius: 50%; background: #1e3a8a; color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; margin: 20px auto; }
    </style>
</head>
<body>
<div class="card">
    <div class="school-header">
        <div class="school-name">مدرسة اليرموك للتعليم الأساسي والثانوي</div>
        <div class="teacher-name">إعداد وتنسيق معلم المادة: أ. الشريف علي الكور</div>
    </div>
    <h2>مفهوم الخوارزميات 🧠</h2>
    <div class="subtitle" id="stepCounter">السؤال 1 من 10</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="quizContent">
        <div id="svgContainer"></div>
        <div class="question-box">
            <strong id="questionText" style="font-size: 14px;">جاري تحميل السؤال...</strong>
            <div id="optionsContainer" style="margin-top: 8px;"></div>
        </div>
        <div id="feedback" class="feedback"></div>
        <button id="actionBtn" class="btn" onclick="checkAnswer()">تأكيد الإجابة</button>
    </div>
    <div id="resultScreen" class="result-screen">
        <h3>أحسنت! أكملت اختبار مفهوم الخوارزميات بنجاح</h3>
        <p>درجتك النهائية:</p>
        <div class="score-circle" id="scoreText"><span style="direction: ltr; display: inline-block;">0/10</span></div>
        
        <!-- حقل عرض رسالة رصد الدرجات أو تنبيه الـ 7 أيام -->
        <div id="apiMessage" class="feedback" style="margin-bottom: 15px; display: none;"></div>

        <!-- زر العودة للشاشة الرئيسية -->
        <a href="/" class="btn" style="background: #16a34a; margin-bottom: 10px;">العودة إلى الشاشة الرئيسية 🏠</a>
    </div>
</div>
<script>
    const quizData = [
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">تعريف الخوارزمية</text></svg>`, question: "1. ما هو التعبير الدقيق لمفهوم 'الخوارزمية' (Algorithm)؟", options: ["مجموعة من التعليمات والخطوات المنطقية المرتبة لحل مسألة", "برنامج تشغيل الجهاز", "نوع من أنواع الشاشات", "عطل فني في المعالج"], correct: 0, explain: "صحيح! الخوارزمية هي سلسلة خطوات منطقية مرتبة بدقة للوصول إلى هدف معين." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#0284c7"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">العالم الإسلامي</text></svg>`, question: "2. يُنسب تأسيس علم الخوارزميات تاريخياً إلى العالم الإسلامي الجليل:", options: ["محمد بن موسى الخوارزمي", "الخوارزمي الكبير", "ابن الهيثم", "جابر بن حيان"], correct: 0, explain: "ممتاز! العالم الخوارزمي هو من وضع الأسس الرياضية الأولى لهذا العلم." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#16a34a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">شروط الخوارزمية</text></svg>`, question: "3. أي مما يلي يُعد شرطاً أساسياً في خطوات أي خوارزمية سليمة؟", options: ["التسلسل والوضوح وأن تنتهي بحل واضح", "أن تكون عشوائية وغير مرتبة", "أن تكون بلا نهاية", "أن تكون معقدة وصعبة الفهم"], correct: 0, explain: "أحسنت! الوضوح والتسلسل ووجود نقطة نهاية شروط رئيسية للخوارزمية." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#d97706"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">أهمية الخوارزمية</text></svg>`, question: "4. ما الفائدة الكبرى من كتابة الخوارزمية قبل البدء بكتابة الأكواد؟", options: ["تسهيل التفكير في الحل وتجنب الأخطاء البرمجية", "زيادة استهلاك مساحة القرص الصلب", "إبطاء سرعة الحاسوب", "منع تشغيل البرنامج نهائياً"], correct: 0, explain: "صحيح! التخطيط المسبق عبر الخوارزميات يسهل عملية البرمجة كثيراً." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#475569"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">خصائص الخطوات</text></svg>`, question: "5. ماذا تعني خاصية 'الوضوح' في خطوات الخوارزمية؟", options: ["أن تكون كل خطوة مفهومة ومحددة بدقة دون أي لبس", "أن تكون مكتوبة بخط كبير جداً", "أن يقرأها الحاسوب بصوت عالي", "ألا يفهمها إلا المبرمج المحترف"], correct: 0, explain: "ممتاز! الوضوح يعني غياب الغموض تماماً في تنفيذ التعليمات." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">طرق التعبير</text></svg>`, question: "6. يمكن التعبير عن الخوارزمية بعدة طرق شائعة، منها:", options: ["الشبه رمز (Pseudocode) والمخطط الانسيابي (Flowchart)", "الصور الثابتة فقط", "التسجيل الصوتى الصامت", "الطباعة الورقية"], correct: 0, explain: "أحسنت! الشبه رمز والمخططات الانسيابية هي الأدوات الأساسية لتمثيل الخوارزميات." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#0284c7"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">التكرار والشرط</text></svg>`, question: "7. هل تدعم الخوارزميات بنيتي 'التكرار' (Loop) و 'الشرط' (Condition)؟", options: ["نعم، تعتبر أساسية في حل المسائل المركبة", "لا، الخوارزميات عبارة عن خطوط مستقيمة فقط", "فقط في لغة بايثون", "غير مسموح بها نهائياً"], correct: 0, explain: "صحيح! التكرار والشروط تمنح الخوارزمية المرونة العالية لمعالجة البيانات." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#16a34a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">بداية ونهاية</text></svg>`, question: "8. هل يجب أن تتضمن الخوارزمية خطوات واضحة للبداية والنهاية؟", options: ["نعم، لكل خوارزمية نقطة شروع ونقطة توقف محددة", "لا، يمكن أن تستمر للأبد دون توقف", "البداية اختيارية والنهاية إجبارية", "لا توجد قاعدة لذلك"], correct: 0, explain: "ممتاز! الحتمية والانتهاء من أهم خصائص الخوارزمية." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#d97706"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">المدخلات والمخرجات</text></svg>`, question: "9. الخوارزمية الناجحة غالباً ما تتعامل مع:", options: ["مدخلات معينة لإنتاج مخرجات صحيحة ومطلوبة", "أجهزة كهربائية معطلة", "ملفات عشوائية بدون فائدة", "شاشات عرض ثلاثية الأبعاد"], correct: 0, explain: "أحسنت! المعالجة تبدأ من مدخلات لتنتهي بمخرجات دقيقة." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">التحقق والتتبع</text></svg>`, question: "10. ما المقصود بتتبع الخوارزمية (Tracing)؟", options: ["اختبار خطواتها يدوياً للتأكد من صحة سير العمل والنتائج", "حذفها من الذاكرة", "طباعتها على الورق", "تغيير لغة البرمجة"], correct: 0, explain: "صحيح! التتبع اليدوي يضمن خلو الخوارزمية من الأخطاء المنطقية قبل البرمجة." }
    ];
    let currentQ = 0, score = 0, selectedOption = null;
    function loadQuestion() {
        selectedOption = null;
        const q = quizData[currentQ];
        document.getElementById("stepCounter").innerText = `السؤال ${currentQ + 1} من ${quizData.length}`;
        document.getElementById("progressFill").style.width = `${(currentQ / quizData.length) * 100}%`;
        document.getElementById("svgContainer").innerHTML = q.svg;
        document.getElementById("questionText").innerText = q.question;
        const optionsDiv = document.getElementById("optionsContainer");
        optionsDiv.innerHTML = "";
        q.options.forEach((opt, idx) => {
            optionsDiv.innerHTML += `<label class="option-label"><input type="radio" name="quizOpt" value="${idx}" onclick="selectedOption = ${idx}"> ${opt}</label>`;
        });
        document.getElementById("feedback").style.display = "none";
        const btn = document.getElementById("actionBtn");
        btn.innerText = "تأكيد الإجابة";
        btn.onclick = checkAnswer;
    }
    function checkAnswer() {
        if (selectedOption === null) { alert("يرجى اختيار إجابة أولاً!"); return; }
        const q = quizData[currentQ], fb = document.getElementById("feedback");
        fb.style.display = "block";
        if (selectedOption === q.correct) { score++; fb.className = "feedback correct"; fb.innerHTML = `✅ ${q.explain}`; }
        else { fb.className = "feedback incorrect"; fb.innerHTML = `❌ إجابة خاطئة. الإجابة الصحيحة هي: (${q.options[q.correct]})`; }
        const btn = document.getElementById("actionBtn");
        if (currentQ < quizData.length - 1) { btn.innerText = "السؤال التالي ➔"; btn.onclick = nextQuestion; }
        else { btn.innerText = "عرض النتيجة النهائية 🏆"; btn.onclick = showResults; }
    }
    function nextQuestion() { currentQ++; loadQuestion(); }
    
    function showResults() {
        document.getElementById("quizContent").style.display = "none";
        document.getElementById("resultScreen").style.display = "block";
        document.getElementById("progressFill").style.width = "100%";
        document.getElementById("stepCounter").innerText = "تم اكتمال الاختبار";
        document.getElementById("scoreText").innerHTML = `<span style="direction: ltr; display: inline-block;">${score} / ${quizData.length}</span>`;

        // استخراج student_id من الرابط وإرسال الدرجة للـ API
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student_id');

        if (studentId) {
            fetch('/api/save_score', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    student_id: studentId,
                    exam_title: "مفهوم الخوارزميات",
                    score: score,
                    max_score: quizData.length
                })
            })
            .then(response => response.json())
            .then(data => {
                const apiMsg = document.getElementById("apiMessage");
                apiMsg.style.display = "block";
                if (data.status === 'success') {
                    apiMsg.className = "feedback correct";
                    apiMsg.innerText = data.message;
                } else {
                    apiMsg.className = "feedback incorrect";
                    apiMsg.innerText = data.message;
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        } else {
            const apiMsg = document.getElementById("apiMessage");
            apiMsg.style.display = "block";
            apiMsg.className = "feedback incorrect";
            apiMsg.innerText = "تنبيه: لم يتم رصد الدرجة لأن رقم الطالب مفقود في الرابط (يرجى الدخول عبر لوحة التحكم الرئيسية).";
        }
    }

    function restartQuiz() { currentQ = 0; score = 0; document.getElementById("quizContent").style.display = "block"; document.getElementById("resultScreen").style.display = "none"; loadQuestion(); }
    loadQuestion();
</script>
</body>
</html>
