<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطوات حل المشكلة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; padding: 15px; direction: rtl; margin: 0; color: #0f172a; }
        .card { background: white; max-width: 550px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .school-header { text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 15px; }
        .school-name { font-size: 14px; color: #64748b; font-weight: 600; }
        .teacher-name { font-size: 13px; color: #94a3b8; margin-top: 2px; }
        h2 { color: #1e3a8a; text-align: center; margin-top: 0; font-size: 19px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 15px; }
        .progress-bar { background: #e2e8f0; border-radius: 10px; height: 10px; width: 100%; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s ease; }
        .svg-container { width: 100%; max-width: 340px; margin: 10px auto; display: block; }
        .question-box { background: #f8fafc; border-right: 4px solid #2563eb; padding: 12px; margin-top: 15px; border-radius: 6px; }
        .option-label { display: flex; align-items: center; margin: 8px 0; cursor: pointer; font-size: 13px; background: white; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; transition: background 0.2s; }
        .option-label:hover { background: #f1f5f9; }
        .option-label input { margin-left: 10px; }
        .btn { display: block; width: 100%; background: #2563eb; color: white; border: none; padding: 11px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; text-decoration: none; }
        .btn:hover { background: #1d4ed8; }
        .feedback { margin-top: 15px; padding: 11px; border-radius: 6px; font-weight: bold; display: none; text-align: center; font-size: 13px; }
        .feedback.correct { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .feedback.incorrect { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 90px; height: 90px; border-radius: 50%; background: #1e3a8a; color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; margin: 20px auto; }
    </style>
</head>
<body>
<div class="card">
    <div class="school-header">
        <div class="school-name">مدرسة اليرموك للتعليم الأساسي والثانوي</div>
        <div class="teacher-name">إعداد وتنسيق معلم المادة: أ. الشريف علي الكور</div>
    </div>
    <h2>خطوات حل المشكلة 🎯</h2>
    <div class="subtitle" id="stepCounter">السؤال 1 من 10</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="quizContent">
        <div id="svgContainer"></div>
        <div class="question-box">
            <strong id="questionText" style="font-size: 14px;">جاري تحميل السؤال...</strong>
            <div id="optionsContainer" style="margin-top: 8px;"></div>
        </div>
        <div id="feedback" class="feedback"></div>
        <button id="actionBtn" class="btn" onclick="checkAnswer()">تأكيد الإجابة</button>
    </div>
    <div id="resultScreen" class="result-screen">
        <h3>أحسنت! أكملت اختبار خطوات حل المشكلة بنجاح</h3>
        <p>درجتك النهائية:</p>
        <div class="score-circle" id="scoreText"><span style="direction: ltr; display: inline-block;">0/10</span></div>
        
        <!-- حقل عرض رسالة رصد الدرجات أو تنبيه الـ 7 أيام -->
        <div id="apiMessage" class="feedback" style="margin-bottom: 15px; display: none;"></div>

        <!-- زر العودة للشاشة الرئيسية -->
        <a href="/" class="btn" style="background: #16a34a; margin-bottom: 10px;">العودة إلى الشاشة الرئيسية 🏠</a>
    </div>
</div>
<script>
    const quizData = [
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">فهم وتحديد المسألة</text></svg>`, question: "1. ما هي الخطوة الأولى والأساسية في مراحل حل أي مسألة حاسوبية؟", options: ["فهم وتحديد المسألة (Definition)", " كتابة كود البرمجة فوراً", "طباعة النتائج", "شراء جهاز حاسوب جديد"], correct: 0, explain: "صحيح! فهم المشكلة وتحديد المدخلات والمخرجات بدقة هو البداية الصحيحة." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#0284c7"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">تصميم الحل (Design)</text></svg>`, question: "2. ماذا تعني مرحلة 'تصميم الحل' في خطوات حل المشكلة؟", options: ["كتابة الخوارزمية ورسم المخطط الانسيابي", "إغلاق الحاسوب", "تثبيت النظام", "تحديد سعر البرنامج"], correct: 0, explain: "ممتاز! تصميم الحل يشمل وضع الخوارزميات والمخططات قبل البرمجة الفعلية." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#16a34a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">كتابة البرنامج (Coding)</text></svg>`, question: "3. المرحلة التي يتم فيها تحويل المخطط الانسيابي إلى لغة برمجة حاسوبية تُسمى:", options: ["كتابة البرنامج (Coding)", "التحليل", "التوثيق", "الاختبار"], correct: 0, explain: "أحسنت! كتابة البرنامج تأتي بعد التصميم لتحويله إلى أكواد قابلة للتنفيذ." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#d97706"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">اختبار البرنامج (Testing)</text></svg>`, question: "4. ما الغرض الأساسي من مرحلة 'اختبار البرنامج وتصحيح أخطائه' (Debugging)؟", options: ["التأكد من خلوه من الأخطاء وإعطائه النتائج الصحيحة", "جعل حجم الملف أكبر", "بطء تشغيل الجهاز", "إخفاء الواجهات"], correct: 0, explain: "صحيح! اختبار البرنامج يضمن صحة النتائج وخلوه من الأخطاء المنطقية والبرمجية." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#475569"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">توثيق البرنامج (Documentation)</text></svg>`, question: "5. ماذا تعني مرحلة 'التوثيق' (Documentation) في دورة حل المسألة؟", options: ["كتابة كافة تفاصيل البرنامج وخطواته ومستنداته للرجوع إليها", "حذف البرنامج نهائياً", "تغيير اسم المطور", "طباعة ورق عادي"], correct: 0, explain: "ممتاز! التوثيق يسجل تفاصيل العمل لسهولة الصيانة والتحديث مستقبلاً." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">تحديد المدخلات والمخرجات</text></svg>`, question: "6. عند فهم المسألة، ما هما العنصران الأساسيان اللذان يجب معرفتهما بوضوح؟", options: ["المدخلات والمخرجات المتوقعة", "لون شاشة الحاسوب", "اسم الشركة المصنعة", "نوع الطابعة المتصلة"], correct: 0, explain: "أحسنت! معرفة ما يدخل وما يخرج هو جوهر تحليل أي مشكلة." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#0284c7"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">اكتشاف الأخطاء وتصحيحها</text></svg>`, question: "7. ظهور نتائج غير صحيحة عند إدخال بيانات صحيحة في البرنامج يدل على وجود:", options: ["خطأ منطقي (Logical Error)", "تلف في الشاشة", "انقطاع التيار الكهربائي", "فقدان الفأرة"], correct: 0, explain: "صحيح! الأخطاء المنطقية لا توقف البرنامج بل تعطي نتائج غير سليمة." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#16a34a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">الترتيب المنطقي للخطوات</text></svg>`, question: "8. لماذا يُعد التسلسل والترتيب المنطقي أمراً حيوياً في حل المشكلات؟", options: ["لضمان تنفيذ الخطوات بالصورة السليمة والوصول للهدف", "لإطالة زمن البرنامج", "لزيادة استهلاك الذاكرة", "ليس له أي أهمية"], correct: 0, explain: "ممتاز! الترتيب المنطقي يمنع تضارب العمليات ويحقق الهدف المطلوب." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#d97706"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">تقسيم المشكلة الكبيرة</text></svg>`, question: "9. في تحليل المسائل المعقدة، يُفضل دائماً:", options: ["تقسيم المشكلة إلى أجزاء أصغر وأسهل في الحل", "ترك المشكلة دون حل", "إلغاء المشروع", "مضاعفة حجم الكود عشوائياً"], correct: 0, explain: "أحسنت! استراتيجية 'فرّق تسد' بتجزئة المسألة تسهل إدارتها وحلها." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">الانتهاء وصيانة البرنامج</text></svg>`, question: "10. هل تنتهي دورة حيات حياة البرنامج بمجرد تشغيله وبيعه؟", options: ["لا، تحتاج البرامج دائماً للمتابعة والصيانة والتحديث", "نعم، يتم نسيانه للأبد", "نعم، لا يحتاج لأي تعديل", "البرامج لا تُحدث أصلاص"], correct: 0, explain: "صحيح! صيانة وتحديث البرامج جزء أساسي ومستمر لضمان كفاءتها." }
    ];
    let currentQ = 0, score = 0, selectedOption = null;
    function loadQuestion() {
        selectedOption = null;
        const q = quizData[currentQ];
        document.getElementById("stepCounter").innerText = `السؤال ${currentQ + 1} من ${quizData.length}`;
        document.getElementById("progressFill").style.width = `${(currentQ / quizData.length) * 100}%`;
        document.getElementById("svgContainer").innerHTML = q.svg;
        document.getElementById("questionText").innerText = q.question;
        const optionsDiv = document.getElementById("optionsContainer");
        optionsDiv.innerHTML = "";
        q.options.forEach((opt, idx) => {
            optionsDiv.innerHTML += `<label class="option-label"><input type="radio" name="quizOpt" value="${idx}" onclick="selectedOption = ${idx}"> ${opt}</label>`;
        });
        document.getElementById("feedback").style.display = "none";
        const btn = document.getElementById("actionBtn");
        btn.innerText = "تأكيد الإجابة";
        btn.onclick = checkAnswer;
    }
    function checkAnswer() {
        if (selectedOption === null) { alert("يرجى اختيار إجابة أولاً!"); return; }
        const q = quizData[currentQ], fb = document.getElementById("feedback");
        fb.style.display = "block";
        if (selectedOption === q.correct) { score++; fb.className = "feedback correct"; fb.innerHTML = `✅ ${q.explain}`; }
        else { fb.className = "feedback incorrect"; fb.innerHTML = `❌ إجابة خاطئة. الإجابة الصحيحة هي: (${q.options[q.correct]})`; }
        const btn = document.getElementById("actionBtn");
        if (currentQ < quizData.length - 1) { btn.innerText = "السؤال التالي ➔"; btn.onclick = nextQuestion; }
        else { btn.innerText = "عرض النتيجة النهائية 🏆"; btn.onclick = showResults; }
    }
    function nextQuestion() { currentQ++; loadQuestion(); }
    
    function showResults() {
        document.getElementById("quizContent").style.display = "none";
        document.getElementById("resultScreen").style.display = "block";
        document.getElementById("progressFill").style.width = "100%";
        document.getElementById("stepCounter").innerText = "تم اكتمال الاختبار";
        document.getElementById("scoreText").innerHTML = `<span style="direction: ltr; display: inline-block;">${score} / ${quizData.length}</span>`;

        // استخراج student_id من الرابط وإرسال الدرجة للـ API
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student_id');

        if (studentId) {
            fetch('/api/save_score', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    student_id: studentId,
                    exam_title: "خطوات حل المشكلة",
                    score: score,
                    max_score: quizData.length
                })
            })
            .then(response => response.json())
            .then(data => {
                const apiMsg = document.getElementById("apiMessage");
                apiMsg.style.display = "block";
                if (data.status === 'success') {
                    apiMsg.className = "feedback correct";
                    apiMsg.innerText = data.message; // رسالة نجاح رصد الدرجات
                } else {
                    apiMsg.className = "feedback incorrect";
                    apiMsg.innerText = data.message; // رسالة خطأ أو تنبيه مرور 7 أيام
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        } else {
            const apiMsg = document.getElementById("apiMessage");
            apiMsg.style.display = "block";
            apiMsg.className = "feedback incorrect";
            apiMsg.innerText = "تنبيه: لم يتم رصد الدرجة لأن رقم الطالب مفقود في الرابط (يرجى الدخول عبر لوحة التحكم الرئيسية).";
        }
    }

    function restartQuiz() { currentQ = 0; score = 0; document.getElementById("quizContent").style.display = "block"; document.getElementById("resultScreen").style.display = "none"; loadQuestion(); }
    loadQuestion();
</script>
</body>
</html>
