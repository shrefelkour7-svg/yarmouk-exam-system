<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء مخططات انسيابية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; padding: 15px; direction: rtl; margin: 0; color: #0f172a; }
        .card { background: white; max-width: 550px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .school-header { text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 15px; }
        .school-name { font-size: 14px; color: #64748b; font-weight: 600; }
        .teacher-name { font-size: 13px; color: #94a3b8; margin-top: 2px; }
        h2 { color: #1e3a8a; text-align: center; margin-top: 0; font-size: 19px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 15px; }
        .progress-bar { background: #e2e8f0; border-radius: 10px; height: 10px; width: 100%; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s ease; }
        .svg-container { width: 100%; max-width: 340px; margin: 10px auto; display: block; }
        .question-box { background: #f8fafc; border-right: 4px solid #2563eb; padding: 12px; margin-top: 15px; border-radius: 6px; }
        .option-label { display: flex; align-items: center; margin: 8px 0; cursor: pointer; font-size: 13px; background: white; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; transition: background 0.2s; }
        .option-label:hover { background: #f1f5f9; }
        .option-label input { margin-left: 10px; }
        .btn { display: block; width: 100%; background: #2563eb; color: white; border: none; padding: 11px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; text-decoration: none; }
        .btn:hover { background: #1d4ed8; }
        .feedback { margin-top: 15px; padding: 11px; border-radius: 6px; font-weight: bold; display: none; text-align: center; font-size: 13px; }
        .feedback.correct { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .feedback.incorrect { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 90px; height: 90px; border-radius: 50%; background: #1e3a8a; color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; margin: 20px auto; }
    </style>
</head>
<body>
<div class="card">
    <div class="school-header">
        <div class="school-name">مدرسة اليرموك للتعليم الأساسي والثانوي</div>
        <div class="teacher-name">إعداد وتنسيق معلم المادة: أ. الشريف علي الكور</div>
    </div>
    <h2>إنشاء مخططات انسيابية ✏️</h2>
    <div class="subtitle" id="stepCounter">السؤال 1 من 10</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="quizContent">
        <div id="svgContainer"></div>
        <div class="question-box">
            <strong id="questionText" style="font-size: 14px;">جاري تحميل السؤال...</strong>
            <div id="optionsContainer" style="margin-top: 8px;"></div>
        </div>
        <div id="feedback" class="feedback"></div>
        <button id="actionBtn" class="btn" onclick="checkAnswer()">تأكيد الإجابة</button>
    </div>
    <div id="resultScreen" class="result-screen">
        <h3>أحسنت! أكملت اختبار إنشاء مخططات انسيابية بنجاح</h3>
        <p>درجتك النهائية:</p>
        <div class="score-circle" id="scoreText"><span style="direction: ltr; display: inline-block;">0/10</span></div>
        
        <div id="apiMessage" class="feedback" style="margin-bottom: 15px; display: none;"></div>
        <a href="/" class="btn" style="background: #16a34a; margin-bottom: 10px;">العودة إلى الشاشة الرئيسية 🏠</a>
    </div>
</div>
<script>
    const quizData = [
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><ellipse cx="160" cy="75" rx="80" ry="30" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">بداية المخطط</text></svg>`, question: "1. عند البدء في رسم مخطط انسيابي لحساب مساحة مستطيل، ما هي الخطوة الأولى التي تُرسم برمجياً؟", options: ["شكل بيضاوي مكتوب بداخته 'البداية' (Start)", "مستطيل العمليات", "متوازي الأضلاع للقراءة", "معين الشروط"], correct: 0, explain: "صحيح! أي مخطط انسيابي يبدأ دائماً بشكل بيضاوي للبداية." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><polygon points="80,45 260,45 240,105 60,105" fill="#0284c7"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">إدخال الطول والعرض</text></svg>`, question: "2. ما هو الشكل الهندسي والبيان المناسب لإدخال طولي ضلعين (الطول L والعرض W) في المخطط؟", options: ["متوازي أضلاع بداخله: ادخل L, W", "مستطيل بداخله L, W", "شكل بيضاوي", "دائرة صغيرة"], correct: 0, explain: "ممتاز! متوازي الأضلاع يُستعمل لعمليات الإدخال وقراءة المتغيرات." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="70" y="45" width="180" height="60" rx="4" fill="#16a34a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">Area = L * W</text></svg>`, question: "3. كيف تُرسم عملية حساب المساحة (Area = L * W) داخل المخطط الانسيابي؟", options: ["داخل مستطيل", "داخل متوازي أضلاع", "داخل معين", "داخل شكل بيضاوي"], correct: 0, explain: "أحسنت! العمليات الحسابية والتخصيص تُرسم حصرياً داخل مستطيل." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><polygon points="80,45 260,45 240,105 60,105" fill="#d97706"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">طباعة النتيجة Area</text></svg>`, question: "4. لعرض النتيجة النهائية للمساحة على الشاشة، أي شكل هندسي يجب استخدامه؟", options: ["متوازي أضلاع بداخله: اطبع Area", "مستطيل بداخله Area", "معين الفحص", "شكل بيضاوي"], correct: 0, explain: "صحيح! متوازي الأضلاع يُستخدم للإدخال والإخراج معاَ." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><ellipse cx="160" cy="75" rx="80" ry="30" fill="#475569"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">نهاية المخطط</text></svg>`, question: "5. ما هي الخطوة الختامية لتنفيذ أي مخطط انسيابي بنجاح؟", options: ["شكل بيضاوي مكتوب بداخله 'النهاية' (End)", "تكرار المدخلات", "حذف المخطط", "رسم مستطيل فارغ"], correct: 0, explain: "ممتاز! ينتهي المخطط الانسيابي دائماً بشكل بيضاوي للنهاية." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><polygon points="160,35 250,75 160,115 70,75" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">اختبار شرط (X > 0)</text></svg>`, question: "6. عندما يتطلب الرسم فرع مسارين بناءً على شرط (مثل هل القيمة موجبة؟)، ما هو الشكل المستخدم؟", options: ["شكل المعين (Diamond)", "مستطيل", "متوازي أضلاع", "شكل بيضاوي"], correct: 0, explain: "أحسنت! المعين مخصص للقرارات ويتفرع منه خطان (نعم / لا)." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#0284c7"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">تسلسل وتدفق الأسهم</text></svg>`, question: "7. عند إنشاء مخطط لتنفيذ عدة عمليات بالترتيب، كيف تربط بين الأشكال الهندسية المختلفة؟", options: ["بواسطة خطوط اتجاه مزودة بأسهم واضحة", "بخطوط متقطعة عشوائية", "بدون أي خطوط", "باستخدام أشكال دائرية متداخلة"], correct: 0, explain: "صحيح! خطوط الاتجاه بالأسهم هي التي توضح مسار التنفيذ." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#16a34a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">تنظيم رسم المخطط</text></svg>`, question: "8. ما القاعدة الهامة عند رسم خطوط الاتجاه في المخططات الانسيابية المعقدة؟", options: ["تجنب تقاطع خطوط الاتجاه قدر الإمكان لكي يظل المخطط مفهوماً", "جعل الخطوط متقاطعة ومتشابكة", "إلغاء الأسهم تماماً", "استخدام الألوان الصاخبة فقط"], correct: 0, explain: "ممتاز! التنظيم وعدم تقاطع الخطوط يسهل قراءة وتتبع المخطط." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#d97706"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">تمثيل التكرار (Loops)</text></svg>`, question: "9. عند إنشاء مخطط لطباعة اسمك 10 مرات، كيف يُعاد توجيه سهم التدفق لإنشاء حلقة تكرارية؟", options: ["إرجاع سهم الاتجاه للأعلى نحو شرط العداد أو البداية", "توجيه السهم خارج الصفحة", "إيقاف المخطط فوراً", "حذف سطر التكرار"], correct: 0, explain: "أحسنت! التكرار يعتمد على حلقة دائرية يُعاد فيها توجيه السهم صعوداً." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">اكتمال المخطط الانسيابي</text></svg>`, question: "10. ما هي الخطوة الأخيره الواجب التأكد منها بعد الانتهاء من رسم أي مخطط انسيابي؟", options: ["تتبع خطوات المخطط يدوياً ببيانات تجريبية للتأكد من صحة النتائج", "رمي الورقة", "تلوين الأشكال فقط", "إغلاق برنامج الرسم"], correct: 0, explain: "صحيح! التتبع التجريبي يضمن خلو المخطط من أي أخطاء منطقية قبل كتابة الكود." }
    ];
    let currentQ = 0, score = 0, selectedOption = null;
    function loadQuestion() {
        selectedOption = null;
        const q = quizData[currentQ];
        document.getElementById("stepCounter").innerText = `السؤال ${currentQ + 1} من ${quizData.length}`;
        document.getElementById("progressFill").style.width = `${(currentQ / quizData.length) * 100}%`;
        document.getElementById("svgContainer").innerHTML = q.svg;
        document.getElementById("questionText").innerText = q.question;
        const optionsDiv = document.getElementById("optionsContainer");
        optionsDiv.innerHTML = "";
        q.options.forEach((opt, idx) => {
            optionsDiv.innerHTML += `<label class="option-label"><input type="radio" name="quizOpt" value="${idx}" onclick="selectedOption = ${idx}"> ${opt}</label>`;
        });
        document.getElementById("feedback").style.display = "none";
        const btn = document.getElementById("actionBtn");
        btn.innerText = "تأكيد الإجابة";
        btn.onclick = checkAnswer;
    }
    function checkAnswer() {
        if (selectedOption === null) { alert("يرجى اختيار إجابة أولاً!"); return; }
        const q = quizData[currentQ], fb = document.getElementById("feedback");
        fb.style.display = "block";
        if (selectedOption === q.correct) { score++; fb.className = "feedback correct"; fb.innerHTML = `✅ ${q.explain}`; }
        else { fb.className = "feedback incorrect"; fb.innerHTML = `❌ إجابة خاطئة. الإجابة الصحيحة هي: (${q.options[q.correct]})`; }
        const btn = document.getElementById("actionBtn");
        if (currentQ < quizData.length - 1) { btn.innerText = "السؤال التالي ➔"; btn.onclick = nextQuestion; }
        else { btn.innerText = "عرض النتيجة النهائية 🏆"; btn.onclick = showResults; }
    }
    function nextQuestion() { currentQ++; loadQuestion(); }
    
    function showResults() {
        document.getElementById("quizContent").style.display = "none";
        document.getElementById("resultScreen").style.display = "block";
        document.getElementById("progressFill").style.width = "100%";
        document.getElementById("stepCounter").innerText = "تم اكتمال الاختبار";
        document.getElementById("scoreText").innerHTML = `<span style="direction: ltr; display: inline-block;">${score} / ${quizData.length}</span>`;

        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student_id');

        if (studentId) {
            fetch('/api/save_score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id: studentId,
                    exam_title: "إنشاء مخططات انسيابية",
                    score: score,
                    max_score: quizData.length
                })
            })
            .then(response => response.json())
            .then(data => {
                const apiMsg = document.getElementById("apiMessage");
                apiMsg.style.display = "block";
                if (data.status === 'success') {
                    apiMsg.className = "feedback correct";
                    apiMsg.innerText = data.message;
                } else {
                    apiMsg.className = "feedback incorrect";
                    apiMsg.innerText = data.message;
                }
            })
            .catch(error => { console.error('Error:', error); });
        } else {
            const apiMsg = document.getElementById("apiMessage");
            apiMsg.style.display = "block";
            apiMsg.className = "feedback incorrect";
            apiMsg.innerText = "تنبيه: لم يتم رصد الدرجة لأن رقم الطالب مفقود في الرابط.";
        }
    }
    loadQuestion();
</script>
</body>
</html>
