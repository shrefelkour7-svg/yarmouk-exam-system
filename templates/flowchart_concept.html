<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفهوم المخططات الانسيابية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; padding: 15px; direction: rtl; margin: 0; color: #0f172a; }
        .card { background: white; max-width: 550px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .school-header { text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 15px; }
        .school-name { font-size: 14px; color: #64748b; font-weight: 600; }
        .teacher-name { font-size: 13px; color: #94a3b8; margin-top: 2px; }
        h2 { color: #1e3a8a; text-align: center; margin-top: 0; font-size: 19px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 15px; }
        .progress-bar { background: #e2e8f0; border-radius: 10px; height: 10px; width: 100%; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s ease; }
        .svg-container { width: 100%; max-width: 340px; margin: 10px auto; display: block; }
        .question-box { background: #f8fafc; border-right: 4px solid #2563eb; padding: 12px; margin-top: 15px; border-radius: 6px; }
        .option-label { display: flex; align-items: center; margin: 8px 0; cursor: pointer; font-size: 13px; background: white; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; transition: background 0.2s; }
        .option-label:hover { background: #f1f5f9; }
        .option-label input { margin-left: 10px; }
        .btn { display: block; width: 100%; background: #2563eb; color: white; border: none; padding: 11px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; text-decoration: none; }
        .btn:hover { background: #1d4ed8; }
        .feedback { margin-top: 15px; padding: 11px; border-radius: 6px; font-weight: bold; display: none; text-align: center; font-size: 13px; }
        .feedback.correct { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .feedback.incorrect { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 90px; height: 90px; border-radius: 50%; background: #1e3a8a; color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; margin: 20px auto; }
    </style>
</head>
<body>
<div class="card">
    <div class="school-header">
        <div class="school-name">مدرسة اليرموك للتعليم الأساسي والثانوي</div>
        <div class="teacher-name">إعداد وتنسيق معلم المادة: أ. الشريف علي الكور</div>
    </div>
    <h2>مفهوم المخططات الانسيابية 📊</h2>
    <div class="subtitle" id="stepCounter">السؤال 1 من 10</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="quizContent">
        <div id="svgContainer"></div>
        <div class="question-box">
            <strong id="questionText" style="font-size: 14px;">جاري تحميل السؤال...</strong>
            <div id="optionsContainer" style="margin-top: 8px;"></div>
        </div>
        <div id="feedback" class="feedback"></div>
        <button id="actionBtn" class="btn" onclick="checkAnswer()">تأكيد الإجابة</button>
    </div>
    <div id="resultScreen" class="result-screen">
        <h3>أحسنت! أكملت اختبار مفهوم المخططات الانسيابية بنجاح</h3>
        <p>درجتك النهائية:</p>
        <div class="score-circle" id="scoreText"><span style="direction: ltr; display: inline-block;">0/10</span></div>
        
        <div id="apiMessage" class="feedback" style="margin-bottom: 15px; display: none;"></div>
        <a href="/" class="btn" style="background: #16a34a; margin-bottom: 10px;">العودة إلى الشاشة الرئيسية 🏠</a>
    </div>
</div>
<script>
    const quizData = [
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">تعريف المخطط الانسيابي</text></svg>`, question: "1. ما هو المخطط الانسيابي (Flowchart)؟", options: ["تمثيل تخطيطي رسومي لخطوات حل المسألة", "برنامج لتصميم الصور الثابتة", "جهاز تخزين إلكتروني", "نوع من أنواع أسلاك التوصيل"], correct: 0, explain: "صحيح! المخطط الانسيابي هو تمثيل رسومي لتوضيح تسلسل خطوات الحل." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><ellipse cx="160" cy="75" rx="90" ry="35" fill="#0284c7"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">شكل البداية والنهاية</text></svg>`, question: "2. ما هو الشكل الهندسي المستخدم لتمثيل نقطتي 'البداية والنهاية' (Terminal) في المخطط الانسيابي؟", options: ["الشكل البيضاوي (Oval)", "المستطيل (Rectangle)", "متوازي الأضلاع (Parallelogram)", "المعين (Diamond)"], correct: 0, explain: "ممتاز! الشكل البيضاوي يُخصص حصرياً للبداية والنهاية." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="70" y="45" width="180" height="60" rx="4" fill="#16a34a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">شكل المعالجة</text></svg>`, question: "3. أي شكل هندسي يُستخدم للتعبير عن عمليات المعالجة والحسابات (مثل Sum = X + Y)؟", options: ["المستطيل (Rectangle)", "الشكل البيضاوي", "المعين", "الدائرة"], correct: 0, explain: "أحسنت! المستطيل يُستخدم للعمليات الحسابية والتخصيص." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><polygon points="80,45 260,45 240,105 60,105" fill="#d97706"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">شكل الإدخال والإخراج</text></svg>`, question: "4. ما هو الشكل الهندسي المستخدم لعمليات 'الإدخال والإخراج' (مثل قراءة عدد أو طباعة النتيجة)؟", options: ["متوازي الأضلاع (Parallelogram)", "المستطيل", "الشكل البيضاوي", "المعين"], correct: 0, explain: "صحيح! متوازي الأضلاع يُستعمل لقراءة البيانات وعرض المخرجات." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><polygon points="160,35 250,75 160,115 70,75" fill="#475569"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">شكل القرار والاتخاذ</text></svg>`, question: "5. ما هو الشكل الهندسي المستخدم لاتخاذ القرار أو فحص شرط معين (مثل هل X > 5)؟", options: ["المعين (Diamond / Decision)", "المستطيل", "متوازي الأضلاع", "الشكل البيضاوي"], correct: 0, explain: "ممتاز! المعين يحتوي على تفرعين (نعم / لا) بناءً على تحقق الشرط." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><line x1="60" y1="75" x2="260" y2="75" stroke="#1e3a8a" stroke-width="5" marker-end="url(#arrow)"/><text x="160" y="60" fill="#1e3a8a" font-size="13" font-weight="bold" text-anchor="middle">أسهم الاتجاه</text></svg>`, question: "6. ما هي وظيفة 'خطوط الاتجاه أو الأسهم' (Flow Lines) في المخطط الانسيابي؟", options: ["تحديد اتجاه وسير تدفق خطوات الحل وترابطها", "حساب المجموع الكلي", "إغلاق البرنامج", "تغيير ألوان الشاشة"], correct: 0, explain: "أحسنت! الأسهم توضح المسار والتسلسل السليم لتنفيذ التعليمات." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#0284c7"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">أهمية المخططات</text></svg>`, question: "7. لماذا تُعتبر المخططات الانسيابية ذات أهمية بالغة للمبرمجين؟", options: ["تسهل فهم المشكلة وتتبع الأخطاء وتوثيق البرنامج بوضوح", "تأخذ مساحة أكبر في القرص الصلب", "تبطئ تنفيذ الأكواد", "تلغي الحاجة لكتابة الأكواد نهائياً"], correct: 0, explain: "صحيح! المخططات تعتبر خريطة طريق مرئية تمنع الأخطاء المنطقية." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#16a34a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">القواعد القياسية</text></svg>`, question: "8. هل توجد قواعد قياسية عالمية معتمدة للأشكال الهندسية في المخططات الانسيابية؟", options: ["نعم، موحدة ومتفق عليها دولياً لتسهيل القراءة المتبادلة", "لا، كل شخص يختار أشكالاً عشوائية حسب مزاجه", "مكتوبة بلغة بايثون حصراً", "تتغير كل يوم"], correct: 0, explain: "ممتاز! الالتزام بالأشكال القياسية يضمن فهم أي مخطط من قبل أي مبرمج." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#d97706"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">اتجاه التدفق العام</text></svg>`, question: "9. عادةً، كيف يكون اتجاه تدفق الخطوط والأسهم في المخطط الانسيابي السليم؟", options: ["من الأعلى إلى الأسفل ومن اليمين إلى اليسار (أو اليسار لليمين)", "من الأسفل إلى الأعلى حصراً", "بشكل دائري مغلق لا يتوقف", "عشوائي بلا نظام"], correct: 0, explain: "أحسنت! الاتجاه القياسي المنطقي يبدأ من أعلى الصفحة إلى أسفلها." },
        { svg: `<svg class="svg-container" viewBox="0 0 320 150"><rect x="60" y="45" width="200" height="60" rx="8" fill="#1e3a8a"/><text x="160" y="80" fill="white" font-size="14" font-weight="bold" text-anchor="middle">الفرق عن الخوارزمية</text></svg>`, question: "10. ما هو الفرق الأساسي بين 'الخوارزمية النصية' و'المخطط الانسيابي'؟", options: ["الخوارزمية تكتب بخطوات نصية، بينما المخطط يمثلها بأشكال رسومية", "لا يوجد أي فرق بينهما", "المخطط لا يحتوي على بداية ونهاية", "الخوارزمية تستخدم لأجهزة الموبايل فقط"], correct: 0, explain: "صحيح! كلاهما يؤدي نفس الغرض، لكن الأول نصي والثاني رسومي تخطيطي." }
    ];
    let currentQ = 0, score = 0, selectedOption = null;
    function loadQuestion() {
        selectedOption = null;
        const q = quizData[currentQ];
        document.getElementById("stepCounter").innerText = `السؤال ${currentQ + 1} من ${quizData.length}`;
        document.getElementById("progressFill").style.width = `${(currentQ / quizData.length) * 100}%`;
        document.getElementById("svgContainer").innerHTML = q.svg;
        document.getElementById("questionText").innerText = q.question;
        const optionsDiv = document.getElementById("optionsContainer");
        optionsDiv.innerHTML = "";
        q.options.forEach((opt, idx) => {
            optionsDiv.innerHTML += `<label class="option-label"><input type="radio" name="quizOpt" value="${idx}" onclick="selectedOption = ${idx}"> ${opt}</label>`;
        });
        document.getElementById("feedback").style.display = "none";
        const btn = document.getElementById("actionBtn");
        btn.innerText = "تأكيد الإجابة";
        btn.onclick = checkAnswer;
    }
    function checkAnswer() {
        if (selectedOption === null) { alert("يرجى اختيار إجابة أولاً!"); return; }
        const q = quizData[currentQ], fb = document.getElementById("feedback");
        fb.style.display = "block";
        if (selectedOption === q.correct) { score++; fb.className = "feedback correct"; fb.innerHTML = `✅ ${q.explain}`; }
        else { fb.className = "feedback incorrect"; fb.innerHTML = `❌ إجابة خاطئة. الإجابة الصحيحة هي: (${q.options[q.correct]})`; }
        const btn = document.getElementById("actionBtn");
        if (currentQ < quizData.length - 1) { btn.innerText = "السؤال التالي ➔"; btn.onclick = nextQuestion; }
        else { btn.innerText = "عرض النتيجة النهائية 🏆"; btn.onclick = showResults; }
    }
    function nextQuestion() { currentQ++; loadQuestion(); }
    
    function showResults() {
        document.getElementById("quizContent").style.display = "none";
        document.getElementById("resultScreen").style.display = "block";
        document.getElementById("progressFill").style.width = "100%";
        document.getElementById("stepCounter").innerText = "تم اكتمال الاختبار";
        document.getElementById("scoreText").innerHTML = `<span style="direction: ltr; display: inline-block;">${score} / ${quizData.length}</span>`;

        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student_id');

        if (studentId) {
            fetch('/api/save_score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id: studentId,
                    exam_title: "مفهوم المخططات الانسيابية",
                    score: score,
                    max_score: quizData.length
                })
            })
            .then(response => response.json())
            .then(data => {
                const apiMsg = document.getElementById("apiMessage");
                apiMsg.style.display = "block";
                if (data.status === 'success') {
                    apiMsg.className = "feedback correct";
                    apiMsg.innerText = data.message;
                } else {
                    apiMsg.className = "feedback incorrect";
                    apiMsg.innerText = data.message;
                }
            })
            .catch(error => { console.error('Error:', error); });
        } else {
            const apiMsg = document.getElementById("apiMessage");
            apiMsg.style.display = "block";
            apiMsg.className = "feedback incorrect";
            apiMsg.innerText = "تنبيه: لم يتم رصد الدرجة لأن رقم الطالب مفقود في الرابط.";
        }
    }
    loadQuestion();
</script>
</body>
</html>
